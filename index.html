<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anas Workbook - Gestion des Parfums</title>
    
    <!-- Lien vers les icônes FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Correctif CSS du menu déroulant du serveur -->
    <link rel="stylesheet" href="/css/fix-dropdown.css">

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s, transform 0.3s, box-shadow 0.3s;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        /* --- ANIMATIONS KEYFRAMES --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* --- EN-TÊTE AVEC ANIMATION --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--card-border);
            animation: fadeIn 0.6s ease-out;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        header h1 {
            font-size: 1.8rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header h1 i {
            color: var(--primary);
            animation: pulse 2s infinite;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #fff;
            background: var(--primary);
            box-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.5);
        }

        .btn-success { background: var(--success); }
        .btn-success:hover { background: #059669; }

        /* --- BARRE D'ACTIONS ET MULTI-SÉLECTION --- */
        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            animation: fadeIn 0.8s ease-out;
        }

        .search-box {
            position: relative;
            width: 300px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px 10px 35px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: #0f172a;
            color: #fff;
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .selection-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* --- GRILLE DES CARTES PARFUMS --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            animation: fadeIn 0.5s ease-out forwards;
            opacity: 0;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border-color: var(--primary);
        }

        /* Cases à cocher pour la multi-sélection */
        .card-checkbox {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--primary);
            transform: scale(1.2);
            transition: transform 0.2s;
        }

        .card-checkbox:hover {
            transform: scale(1.4);
        }

        .card.selected {
            border: 2px solid var(--primary);
            background: #1e293b;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        .card-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #fff;
            padding-right: 30px;
        }

        .doc-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .doc-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-radius: 6px;
            background: #0f172a;
            font-size: 0.9rem;
        }

        .doc-item.available { border-left: 4px solid var(--success); }
        .doc-item.missing { border-left: 4px solid var(--danger); opacity: 0.6; }

        .doc-item a {
            color: var(--primary);
            text-decoration: none;
        }

        .doc-item a:hover {
            text-decoration: underline;
        }

        /* --- BARRE FLOTTANTE POUR TELECHARGEMENT EN MASSE (ZIP) --- */
        .floating-action-bar {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--primary);
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 15px;
            transform: translateY(150px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }

        .floating-action-bar.active {
            transform: translateY(0);
        }

        .badge {
            background: white;
            color: var(--primary);
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-flask"></i> Anas Workbook - Parfums</h1>
        <div class="nav-links">
            <a href="/crm" class="btn"><i class="fa-solid fa-users"></i> CRM Clients</a>
            <a href="/report" class="btn btn-success"><i class="fa-solid fa-file-invoice"></i> Rapport Documents</a>
        </div>
    </header>

    <div class="actions-bar">
        <div class="search-box">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="searchInput" placeholder="Rechercher un parfum..." onkeyup="filterPerfumes()">
        </div>

        <div class="selection-controls">
            <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)"> 
                <strong>Tout Sélectionner</strong>
            </label>
        </div>
    </div>

    <!-- Grille de contenus -->
    <div class="grid-container" id="perfumeGrid">
        <!-- Rempli dynamiquement en JS -->
    </div>

    <!-- Barre Flottante de Sélection Multiples -->
    <div class="floating-action-bar" id="floatingBar">
        <span><span class="badge" id="selectedCount">0</span> Fichier(s) sélectionné(s)</span>
        <button class="btn btn-success" onclick="downloadSelectedZip()">
            <i class="fa-solid fa-file-zipper"></i> Télécharger en ZIP
        </button>
    </div>

    <script>
        let perfumesData = [];
        let selectedFiles = new Set();

        // Charger les données de l'API
        async function loadPerfumes() {
            try {
                const res = await fetch('/api/perfumes-docs');
                perfumesData = await res.json();
                renderCards(perfumesData);
            } catch (err) {
                console.error("Erreur de chargement :", err);
            }
        }

        // Affichage dynamique des cartes avec animations différées
        function renderCards(data) {
            const container = document.getElementById('perfumeGrid');
            container.innerHTML = '';

            data.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${(index % 15) * 0.05}s`; // Animation fluide en cascade

                let docsHTML = '';
                const types = ['INCI', 'COA', 'MSDS'];

                types.forEach(type => {
                    const fileObj = item.files[type];
                    if (fileObj) {
                        docsHTML += `
                            <li class="doc-item available">
                                <span><i class="fa-solid fa-circle-check" style="color:var(--success)"></i> ${type}</span>
                                <a href="${fileObj.url}" target="_blank"><i class="fa-solid fa-download"></i></a>
                            </li>
                        `;
                    } else {
                        docsHTML += `
                            <li class="doc-item missing">
                                <span><i class="fa-solid fa-circle-xmark" style="color:var(--danger)"></i> ${type}</span>
                                <small>Manquant</small>
                            </li>
                        `;
                    }
                });

                card.innerHTML = `
                    <input type="checkbox" class="card-checkbox" onchange="toggleCardSelection(this, '${item.name}')">
                    <h3 class="card-title">${item.name}</h3>
                    <ul class="doc-list">${docsHTML}</ul>
                `;

                container.appendChild(card);
            });
        }

        // Recherche dynamique
        function filterPerfumes() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = perfumesData.filter(p => p.name.toLowerCase().includes(query));
            renderCards(filtered);
        }

        // Gestion de la sélection par carte
        function toggleCardSelection(checkbox, perfumeName) {
            const card = checkbox.closest('.card');
            const perfume = perfumesData.find(p => p.name === perfumeName);

            if (checkbox.checked) {
                card.classList.add('selected');
                Object.values(perfume.files).forEach(f => selectedFiles.add(f.path));
            } else {
                card.classList.remove('selected');
                Object.values(perfume.files).forEach(f => selectedFiles.delete(f.path));
            }
            updateFloatingBar();
        }

        // Sélectionner tout
        function toggleSelectAll(masterCheckbox) {
            const checkboxes = document.querySelectorAll('.card-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = masterCheckbox.checked;
                cb.dispatchEvent(new Event('change'));
            });
        }

        // Mettre à jour la barre flottante de téléchargement ZIP
        function updateFloatingBar() {
            const bar = document.getElementById('floatingBar');
            const count = document.getElementById('selectedCount');
            count.innerText = selectedFiles.size;

            if (selectedFiles.size > 0) {
                bar.classList.add('active');
            } else {
                bar.classList.remove('active');
            }
        }

        // Lancer le téléchargement groupé ZIP
        async function downloadSelectedZip() {
            if (selectedFiles.size === 0) return;

            const response = await fetch('/download-zip', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ files: Array.from(selectedFiles) })
            });

            if (response.ok) {
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = "Documents_Selectionnes.zip";
                document.body.appendChild(a);
                a.click();
                a.remove();
            } else {
                alert("Erreur lors du téléchargement du fichier ZIP");
            }
        }

        // Démarrage
        loadPerfumes();
    </script>
</body>
</html>

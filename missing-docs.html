<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anas Workbook - Rapport Documents Manquants</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/fix-dropdown.css">

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s, transform 0.3s, box-shadow 0.3s;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--card-border);
            animation: fadeIn 0.6s ease-out;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        header h1 {
            font-size: 1.8rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header h1 i {
            color: var(--danger);
            animation: pulse 2s infinite;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #fff;
            background: var(--primary);
            box-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.5);
        }

        .btn-excel { background: #107c41; }
        .btn-excel:hover { background: #0b5a2f; }
        .btn-word { background: #185abd; }
        .btn-word:hover { background: #103f8a; }
        .btn-pdf { background: #b30b00; }
        .btn-pdf:hover { background: #7f0800; }

        /* --- STATISTIQUES CARDS ANIMÉES --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            animation: fadeIn 0.8s ease-out forwards;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .stat-card h2 {
            font-size: 2.2rem;
            margin-top: 10px;
            color: var(--danger);
        }

        /* --- ACTIONS & TABLEAU --- */
        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            animation: fadeIn 0.9s ease-out;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            width: 300px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px 10px 35px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: #0f172a;
            color: #fff;
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .export-btns {
            display: flex;
            gap: 10px;
        }

        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            animation: fadeIn 1s ease-out;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 15px 20px;
            border-bottom: 1px solid var(--card-border);
        }

        th {
            background: #0f172a;
            color: var(--text-muted);
            font-weight: 600;
        }

        tbody tr {
            animation: fadeIn 0.4s ease-out forwards;
            opacity: 0;
        }

        tbody tr:hover {
            background: rgba(239, 68, 68, 0.05);
        }

        .tag-missing {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-right: 5px;
            display: inline-block;
        }

        .tag-present {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-right: 5px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-triangle-exclamation"></i> Rapport Documents Manquants</h1>
        <div class="nav-links">
            <a href="/" class="btn"><i class="fa-solid fa-flask"></i> Parfums</a>
            <a href="/crm" class="btn"><i class="fa-solid fa-users"></i> CRM Clients</a>
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <span style="color:var(--text-muted)">Parfums Incomplets</span>
            <h2 id="incompleteCount">0</h2>
        </div>
        <div class="stat-card">
            <span style="color:var(--text-muted)">INCI Manquants</span>
            <h2 id="missingINCI">0</h2>
        </div>
        <div class="stat-card">
            <span style="color:var(--text-muted)">COA Manquants</span>
            <h2 id="missingCOA">0</h2>
        </div>
        <div class="stat-card">
            <span style="color:var(--text-muted)">MSDS Manquants</span>
            <h2 id="missingMSDS">0</h2>
        </div>
    </div>

    <div class="actions-bar">
        <div class="search-box">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="searchInput" placeholder="Filtrer un parfum..." onkeyup="filterReport()">
        </div>

        <div class="export-btns">
            <a href="/api/export/excel" class="btn btn-excel"><i class="fa-solid fa-file-excel"></i> Excel</a>
            <a href="/api/export/word" class="btn btn-word"><i class="fa-solid fa-file-word"></i> Word</a>
            <a href="/api/export/pdf" class="btn btn-pdf"><i class="fa-solid fa-file-pdf"></i> PDF</a>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Parfum</th>
                    <th>Documents Manquants</th>
                    <th>Documents Disponibles</th>
                </tr>
            </thead>
            <tbody id="reportTableBody">
                <!-- Chargé dynamiquement -->
            </tbody>
        </table>
    </div>

    <script>
        let reportData = [];

        async function loadReport() {
            try {
                const res = await fetch('/api/missing-docs-report');
                const data = await res.json();
                
                document.getElementById('incompleteCount').innerText = data.incompleteCount;
                document.getElementById('missingINCI').innerText = data.stats.missingINCI;
                document.getElementById('missingCOA').innerText = data.stats.missingCOA;
                document.getElementById('missingMSDS').innerText = data.stats.missingMSDS;

                reportData = data.report;
                renderReport(reportData);
            } catch (err) {
                console.error("Erreur du rapport :", err);
            }
        }

        function renderReport(report) {
            const tbody = document.getElementById('reportTableBody');
            tbody.innerHTML = '';

            report.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.style.animationDelay = `${(index % 10) * 0.05}s`;

                const missingTags = item.missing.map(m => `<span class="tag-missing"><i class="fa-solid fa-xmark"></i> ${m}</span>`).join('');
                const presentTags = item.present.map(p => `<span class="tag-present"><i class="fa-solid fa-check"></i> ${p}</span>`).join('');

                tr.innerHTML = `
                    <td><strong>${item.name}</strong></td>
                    <td>${missingTags}</td>
                    <td>${presentTags}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterReport() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = reportData.filter(item => item.name.toLowerCase().includes(query));
            renderReport(filtered);
        }

        loadReport();
    </script>
</body>
</html>

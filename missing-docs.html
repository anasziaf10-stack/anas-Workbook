<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anas Workbook - Rapport Documents Manquants</title>

    <!-- Lien vers les icônes FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Correctif CSS du menu déroulant du serveur -->
    <link rel="stylesheet" href="/css/fix-dropdown.css">

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s, transform 0.3s, box-shadow 0.3s;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* --- EN-TÊTE --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--card-border);
            animation: fadeIn 0.6s ease-out;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            flex-wrap: wrap;
            gap: 15px;
        }

        header h1 {
            font-size: 1.8rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header h1 i {
            color: var(--danger);
            animation: pulse 2s infinite;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #fff;
            background: var(--primary);
            box-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
            white-space: nowrap;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.5);
        }

        .btn-success { background: var(--success); }
        .btn-success:hover { background: #059669; }

        /* --- MENU DÉROULANT EXPORT --- */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            background-color: var(--card-bg);
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.4);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            z-index: 100;
            overflow: hidden;
            animation: fadeIn 0.2s ease-out;
        }

        .dropdown-content.show {
            display: block;
        }

        .dropdown-content a {
            color: var(--text-main);
            padding: 12px 16px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .dropdown-content a:hover {
            background-color: #0f172a;
            color: var(--primary);
        }

        /* --- STATISTIQUES --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            animation: fadeIn 0.6s ease-out;
            text-align: center;
        }

        .stat-card .stat-value {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .stat-card .stat-label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .stat-total .stat-value { color: var(--text-main); }
        .stat-inci .stat-value { color: var(--warning); }
        .stat-coa .stat-value { color: var(--danger); }
        .stat-msds .stat-value { color: #f472b6; }

        /* --- BARRE DE RECHERCHE --- */
        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            animation: fadeIn 0.8s ease-out;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-box {
            position: relative;
            width: 300px;
            max-width: 100%;
            flex: 1 1 300px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px 10px 35px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: #0f172a;
            color: #fff;
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* --- GRILLE DES CARTES --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            animation: fadeIn 0.5s ease-out forwards;
            opacity: 0;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border-color: var(--danger);
        }

        .card-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #fff;
        }

        .doc-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .doc-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-radius: 6px;
            background: #0f172a;
            font-size: 0.9rem;
        }

        .doc-item.available { border-left: 4px solid var(--success); }
        .doc-item.missing { border-left: 4px solid var(--danger); opacity: 0.75; }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
        }

        .empty-state i {
            font-size: 3rem;
            color: var(--success);
            margin-bottom: 15px;
            display: block;
        }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 768px) {
            body { padding: 12px; }
            header {
                flex-direction: column;
                align-items: flex-start;
                padding: 16px;
                margin-bottom: 20px;
            }
            header h1 { font-size: 1.3rem; }
            .nav-links { width: 100%; justify-content: space-between; }
            .nav-links .btn {
                flex: 1 1 auto;
                justify-content: center;
                font-size: 0.8rem;
                padding: 9px 12px;
            }
            .actions-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .search-box { width: 100%; }
            .grid-container {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 400px) {
            header h1 { font-size: 1.1rem; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-file-circle-exclamation"></i> Rapport - Documents Manquants</h1>
        <div class="nav-links">
            <a href="/" class="btn"><i class="fa-solid fa-flask"></i> Parfums</a>
            <a href="/crm" class="btn btn-success"><i class="fa-solid fa-users"></i> CRM Clients</a>
            
            <!-- Bouton Exporter avec Menu Déroulant -->
            <div class="dropdown">
                <button class="btn" onclick="toggleExportMenu(event)">
                    <i class="fa-solid fa-file-export"></i> Exporter <i class="fa-solid fa-caret-down"></i>
                </button>
                <div id="exportDropdown" class="dropdown-content">
                    <a href="#" onclick="exportReport('pdf')"><i class="fa-solid fa-file-pdf" style="color: var(--danger);"></i> Format PDF</a>
                    <a href="#" onclick="exportReport('excel')"><i class="fa-solid fa-file-excel" style="color: var(--success);"></i> Format Excel</a>
                    <a href="#" onclick="exportReport('word')"><i class="fa-solid fa-file-word" style="color: var(--primary);"></i> Format Word</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Statistiques globales -->
    <div class="stats-grid" id="statsGrid">
        <!-- Rempli dynamiquement en JS -->
    </div>

    <div class="actions-bar">
        <div class="search-box">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="searchInput" placeholder="Rechercher un parfum..." onkeyup="filterReport()">
        </div>
    </div>

    <!-- Grille de contenus -->
    <div class="grid-container" id="reportGrid">
        <!-- Rempli dynamiquement en JS -->
    </div>

    <script>
        let reportData = [];
        let statsData = {};

        async function loadReport() {
            try {
                const res = await fetch('/api/missing-docs-report');
                const data = await res.json();
                reportData = data.report || [];
                statsData = data.stats || {};
                renderStats(data.incompleteCount || 0, statsData);
                renderReportCards(reportData);
            } catch (err) {
                console.error("Erreur de chargement du rapport :", err);
                document.getElementById('reportGrid').innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-triangle-exclamation" style="color: var(--danger);"></i>
                        Erreur lors du chargement du rapport.
                    </div>
                `;
            }
        }

        function renderStats(incompleteCount, stats) {
            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = `
                <div class="stat-card stat-total">
                    <div class="stat-value">${incompleteCount}</div>
                    <div class="stat-label">Parfums incomplets</div>
                </div>
                <div class="stat-card stat-inci">
                    <div class="stat-value">${stats.missingINCI || 0}</div>
                    <div class="stat-label">INCI manquants</div>
                </div>
                <div class="stat-card stat-coa">
                    <div class="stat-value">${stats.missingCOA || 0}</div>
                    <div class="stat-label">COA manquants</div>
                </div>
                <div class="stat-card stat-msds">
                    <div class="stat-value">${stats.missingMSDS || 0}</div>
                    <div class="stat-label">MSDS manquants</div>
                </div>
            `;
        }

        function renderReportCards(data) {
            const container = document.getElementById('reportGrid');
            container.innerHTML = '';

            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-circle-check"></i>
                        Tous les parfums ont leurs documents complets !
                    </div>
                `;
                return;
            }

            const allTypes = ['INCI', 'COA', 'MSDS'];

            data.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${(index % 15) * 0.05}s`;

                let docsHTML = '';
                allTypes.forEach(type => {
                    const isPresent = item.present && item.present.includes(type);
                    if (isPresent) {
                        docsHTML += `
                            <li class="doc-item available">
                                <span><i class="fa-solid fa-circle-check" style="color:var(--success)"></i> ${type}</span>
                                <small>Présent</small>
                            </li>
                        `;
                    } else {
                        docsHTML += `
                            <li class="doc-item missing">
                                <span><i class="fa-solid fa-circle-xmark" style="color:var(--danger)"></i> ${type}</span>
                                <small>Manquant</small>
                            </li>
                        `;
                    }
                });

                card.innerHTML = `
                    <h3 class="card-title">${item.name}</h3>
                    <ul class="doc-list">${docsHTML}</ul>
                `;

                container.appendChild(card);
            });
        }

        function filterReport() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = reportData.filter(p => p.name.toLowerCase().includes(query));
            renderReportCards(filtered);
        }

        // --- GESTION DU MENU DÉROULANT D'EXPORT ---
        function toggleExportMenu(event) {
            event.stopPropagation();
            document.getElementById("exportDropdown").classList.toggle("show");
        }

        // Fermer le menu si l'utilisateur clique en dehors
        window.onclick = function(event) {
            if (!event.target.matches('.dropdown button') && !event.target.closest('.dropdown')) {
                const dropdowns = document.getElementsByClassName("dropdown-content");
                for (let i = 0; i < dropdowns.length; i++) {
                    const openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }

        // Fonction d'exportation (à lier à vos routes backend selon vos besoins)
        function exportReport(format) {
            // Fermer le menu après sélection
            document.getElementById("exportDropdown").classList.remove('show');
            
            // Exemple d'action d'export
            console.log(`Exportation du rapport au format : ${format.toUpperCase()}`);
            window.location.href = `/api/export-report?format=${format}`;
        }

        // Démarrage
        loadReport();
    </script>
</body>
</html>
